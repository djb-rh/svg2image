<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background-color: #fff;
         background-image: conic-gradient(#e4e4e4 25%, transparent 0 50%, #e4e4e4 0 75%, transparent 0);
         background-size: 16px 16px; }
  body.white { background: #fff; }
  body.dark { background: #2b2b2b; }
  #stage { position: absolute; inset: 0; padding: 28px; box-sizing: border-box; cursor: crosshair; }
  #stage > svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #sel { position: absolute; pointer-events: none; display: none;
         border: 1.5px dashed #0a84ff; border-radius: 2px;
         box-shadow: 0 0 0 1px rgba(255,255,255,.85), inset 0 0 0 1px rgba(255,255,255,.85); }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
         font: 14px -apple-system, sans-serif; color: #888; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="sel"></div>
<div id="msg"></div>
<script src="editor.js"></script>
</body>
</html>
